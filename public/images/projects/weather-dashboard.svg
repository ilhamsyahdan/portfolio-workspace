<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1e1b4b"/>
  <rect x="50" y="50" width="700" height="500" fill="#312e81" rx="8"/>
  
  <!-- Weather icon - sun with clouds -->
  <circle cx="400" cy="220" r="80" fill="#fbbf24" opacity="0.3"/>
  <circle cx="400" cy="220" r="50" fill="#fbbf24"/>
  
  <!-- Cloud -->
  <ellipse cx="420" cy="270" rx="45" ry="30" fill="#e0e7ff"/>
  <ellipse cx="390" cy="275" rx="35" ry="25" fill="#e0e7ff"/>
  <ellipse cx="450" cy="275" rx="30" ry="20" fill="#e0e7ff"/>
  
  <!-- Chart bars -->
  <rect x="250" y="320" width="30" height="40" fill="#6366f1" opacity="0.7"/>
  <rect x="300" y="300" width="30" height="60" fill="#6366f1" opacity="0.7"/>
  <rect x="350" y="310" width="30" height="50" fill="#6366f1" opacity="0.7"/>
  <rect x="400" y="290" width="30" height="70" fill="#6366f1" opacity="0.7"/>
  <rect x="450" y="305" width="30" height="55" fill="#6366f1" opacity="0.7"/>
  <rect x="500" y="315" width="30" height="45" fill="#6366f1" opacity="0.7"/>
  
  <!-- Title -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="32" fill="#f1f5f9" text-anchor="middle" font-weight="bold">Weather Dashboard</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="18" fill="#c7d2fe" text-anchor="middle">React • TypeScript • Chart.js • PWA</text>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="450" r="20" fill="#fbbf24" opacity="0.3"/>
  <circle cx="650" cy="150" r="25" fill="#6366f1" opacity="0.3"/>
</svg>
