<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#18181b"/>
  <rect x="50" y="50" width="700" height="500" fill="#27272a" rx="8"/>
  
  <!-- Document/CMS representation -->
  <circle cx="400" cy="250" r="80" fill="#06b6d4" opacity="0.2"/>
  
  <!-- Document icon -->
  <rect x="320" y="180" width="160" height="200" fill="#3f3f46" rx="4"/>
  <rect x="320" y="180" width="160" height="40" fill="#06b6d4" rx="4"/>
  
  <!-- Text lines -->
  <line x1="340" y1="240" x2="460" y2="240" stroke="#71717a" stroke-width="4"/>
  <line x1="340" y1="260" x2="460" y2="260" stroke="#71717a" stroke-width="4"/>
  <line x1="340" y1="280" x2="460" y2="280" stroke="#71717a" stroke-width="4"/>
  <line x1="340" y1="300" x2="420" y2="300" stroke="#71717a" stroke-width="4"/>
  
  <!-- Edit icon -->
  <path d="M 440 320 L 460 340 L 450 350 L 430 330 Z" fill="#06b6d4"/>
  
  <!-- Title -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="32" fill="#f1f5f9" text-anchor="middle" font-weight="bold">Headless Blog CMS</text>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Next.js • TypeScript • Prisma • MDX</text>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="15" fill="#06b6d4" opacity="0.3"/>
  <circle cx="650" cy="450" r="25" fill="#06b6d4" opacity="0.3"/>
</svg>
