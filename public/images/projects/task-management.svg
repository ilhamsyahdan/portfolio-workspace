<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0f172a"/>
  <rect x="50" y="50" width="700" height="500" fill="#1e293b" rx="8"/>
  
  <!-- Kanban board representation -->
  <circle cx="400" cy="250" r="80" fill="#8b5cf6" opacity="0.2"/>
  
  <!-- Three columns -->
  <rect x="200" y="200" width="80" height="120" fill="#334155" rx="4"/>
  <rect x="310" y="200" width="80" height="120" fill="#334155" rx="4"/>
  <rect x="420" y="200" width="80" height="120" fill="#334155" rx="4"/>
  
  <!-- Cards in columns -->
  <rect x="210" y="210" width="60" height="30" fill="#8b5cf6" rx="2"/>
  <rect x="210" y="250" width="60" height="30" fill="#8b5cf6" rx="2"/>
  <rect x="320" y="210" width="60" height="30" fill="#a78bfa" rx="2"/>
  <rect x="430" y="210" width="60" height="30" fill="#c4b5fd" rx="2"/>
  
  <!-- Title -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="32" fill="#f1f5f9" text-anchor="middle" font-weight="bold">Task Management App</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Vue.js • TypeScript • Express • MongoDB</text>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="120" r="15" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="680" cy="480" r="25" fill="#8b5cf6" opacity="0.3"/>
</svg>
